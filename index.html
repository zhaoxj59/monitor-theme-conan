         never flashes dark nor the dark default light. Dark unless the saved
         choice says light; only the toggle in the page writes the key. -->
    <script>
      try {
        if (localStorage.getItem("conan-mode") !== "light") document.documentElement.classList.add("dark")
        // The visitor's visual style, likewise before first paint; an
        // operator default from the theme config can only apply after it
        // loads, and "conan" is both defaults, so nothing flashes for the
        // common case. The key matches the name the 2.0 enhancement layer
        // used, so a choice made there carries over.
        var s = localStorage.getItem("conan-theme-style")
        if (s === "kid" || s === "organization") document.documentElement.dataset.style = s
      } catch (e) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="conan-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      // The splash's failsafe: main.tsx fades it the moment the app mounts,
      // but if the bundle is blocked or broken it must not become the page.
      setTimeout(function () {
        var s = document.getElementById("conan-splash")
        if (s) s.remove()
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
